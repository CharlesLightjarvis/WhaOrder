[program:whaorder-queue]
command      = php /var/www/html/artisan queue:work --queue=default --sleep=3 --tries=3 --timeout=120 --max-time=3600 --memory=256
directory    = /var/www/html
user         = www-data
priority     = 40
autostart    = true
autorestart  = true
numprocs     = 1
process_name = %(program_name)s_%(process_num)02d
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
; Wait for jobs to finish before killing on restart
stopasgroup  = true
killasgroup  = true
stopwaitsecs = 150
stopsignal   = SIGTERM
