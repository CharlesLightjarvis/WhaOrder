[program:whaorder-scheduler]
; Laravel scheduler runs every minute — shell loop avoids needing cron
command      = php /var/www/html/artisan schedule:work --no-interaction
directory    = /var/www/html
user         = www-data
priority     = 50
autostart    = true
autorestart  = true
stopasgroup  = true
killasgroup  = true
stopsignal   = SIGTERM
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
